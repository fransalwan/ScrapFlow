services:
  # --- Database Service ---
  db:
    image: postgres:15-alpine
    container_name: scrap_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scrapFlow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend API Service ---
  api:
    build: .
    container_name: scrap_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ⚠️ PENTING: DB_HOST diganti jadi 'db' (nama service di atas), BUKAN 'localhost'
      - DB_HOST=db
      - DB_PORT=5433
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=scrapFlow_db
      - DB_SSLMODE=disable
      
      # JWT Config
      - JWT_SECRET=rahasia_banget_ganti_di_production_12345
      - JWT_EXPIRATION_HOURS=24
    depends_on:
      db:
        condition: service_healthy # Nunggu database siap dulu sebelum API jalan
    # Opsional: Kalau mau auto-migrate pas start, bisa tambahin command ini:
    #command: sh -c "./main -reset"

volumes:
  postgres_data: